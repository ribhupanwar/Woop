name: Woop iOS unsigned IPA

on:
  push:
    branches: [main, feature/whoop-575-ui-parity, feature/today-activities-feed, codex/consolidated-release]
    paths:
      - ".github/workflows/build-woop-ipa.yml"
      - "Strand/**"
      - "StrandTests/**"
      - "StrandiOS/**"
      - "StrandiOSShared/**"
      - "StrandiOSWidgets/**"
      - "StrandiOSTests/**"
      - "Packages/**"
      - "project.yml"
      - "Tools/local-tests.sh"
      - "Tools/make_icon.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: woop-ios-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-unsigned-ipa:
    name: Build Woop for iPhone and package unsigned IPA
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out UI parity branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Select Xcode 26 SDK and install XcodeGen
        run: |
          set -euo pipefail
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          case "$xcode_version" in
            "Xcode 26."*) ;;
            *) echo "::error::This project uses iOS 26 Liquid Glass APIs; Xcode 26 or newer is required."; exit 1 ;;
          esac
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version

      # Cache the large pinned runtime/model between clean GitHub-hosted runners.
      # bootstrap-nomic.sh still verifies both inputs against their hard-coded SHA-256 values.
      - name: Restore verified Nomic build-input cache
        uses: actions/cache@v4
        with:
          path: |
            Vendor/Nomic/llama.xcframework
            Vendor/Nomic/Resources/nomic-embed-text-v2-moe.Q4_K_M.gguf
          key: macos-26-nomic-${{ hashFiles('Tools/bootstrap-nomic.sh') }}

      - name: Install or verify pinned on-device model and runtime
        run: |
          chmod +x Tools/bootstrap-nomic.sh
          Tools/bootstrap-nomic.sh
          Tools/bootstrap-nomic.sh --check

      # Validate package logic and the macOS app. The Release device archive below is the iOS
      # compile gate; a separate simulator build here compiled the same app a second time.
      - name: Run package and macOS validation
        run: |
          set -euo pipefail
          echo "Validating latest Woop source before IPA packaging."
          echo "The final iOS device archive is the iOS compile gate."
          NOOP_LOCAL_TESTS_SKIP_IOS_SIMULATOR_BUILD=1 bash Tools/local-tests.sh origin/main

      - name: Generate original Woop app icon
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/icon-venv"
          "$RUNNER_TEMP/icon-venv/bin/python" -m pip install --upgrade pip numpy pillow
          "$RUNNER_TEMP/icon-venv/bin/python" Tools/make_icon.py
          cp Tools/woop_icon_1024.png StrandiOS/Resources/Assets.xcassets/AppIcon.appiconset/icon_1024.png
          cp Tools/woop_icon_1024.png StrandiOS/Resources/Assets.xcassets/AppIcon.appiconset/icon_1024_dark.png
          cp Tools/woop_icon_1024.png StrandiOS/Resources/Assets.xcassets/AppIcon.appiconset/icon_1024_tinted.png
          cp Tools/woop_icon_1024.png StrandiOS/Resources/Assets.xcassets/AppIcon-Navy.appiconset/icon_1024.png

      - name: Generate Xcode project and verify scheme
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -list -project Strand.xcodeproj
          xcodebuild -list -json -project Strand.xcodeproj > "$RUNNER_TEMP/xcode-list.json"
          python3 - "$RUNNER_TEMP/xcode-list.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as f:
              data = json.load(f)
          schemes = data.get("project", {}).get("schemes", [])
          if "NOOPiOS" not in schemes:
              raise SystemExit(f"NOOPiOS scheme missing; found: {schemes}")
          print("Verified NOOPiOS scheme.")
          PY

      - name: Archive unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Strand.xcodeproj \
            -scheme NOOPiOS \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Woop.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/woop-archive.log"
          # Keep the iOS 17 availability gate without a second simulator compile.
          if grep -E "warning: .*(is only available in iOS|does not implement 'buildLimitedAvailability')" "$RUNNER_TEMP/woop-archive.log" >&2; then
            echo "::error::The iOS archive uses an API newer than the iOS 17 deployment target."
            exit 1
          fi

      - name: Package and verify IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Woop.xcarchive/Products/Applications/NOOP Staging.app"
          test -d "$APP" || { echo "::error::NOOP Staging.app missing from archive"; find "$RUNNER_TEMP/Woop.xcarchive/Products" -maxdepth 4 -print; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/Woop.app"
          # Free Apple ID / SideStore installs append the team suffix to the iPhone
          # bundle identifier. An embedded Watch app keeps its unsuffixed companion
          # identifier and makes iOS reject the install (InvalidCompanionAppBundleIdentifier).
          # This sideload IPA intentionally excludes Watch + extensions; the full archive
          # and source-build targets retain them for paid-team / Xcode distribution.
          rm -rf "$RUNNER_TEMP/ipa/Payload/Woop.app/Watch" "$RUNNER_TEMP/ipa/Payload/Woop.app/PlugIns"
          test ! -e "$RUNNER_TEMP/ipa/Payload/Woop.app/Watch"
          test ! -e "$RUNNER_TEMP/ipa/Payload/Woop.app/PlugIns"
          # The 328 MB Nomic GGUF is only needed for optional semantic Coach retrieval. The Lite
          # SideStore IPA keeps keyword retrieval and omits this model; the full Xcode archive keeps it.
          MODEL_NAME="nomic-embed-text-v2-moe.Q4_K_M.gguf"
          ARCHIVE_MODEL="$(find "$APP" -name "$MODEL_NAME" -type f -print -quit)"
          test -n "$ARCHIVE_MODEL" || { echo "::error::Nomic model missing from full archive"; exit 1; }
          IPA_MODEL="$(find "$RUNNER_TEMP/ipa/Payload/Woop.app" -name "$MODEL_NAME" -type f -print -quit)"
          test -n "$IPA_MODEL" || { echo "::error::Nomic model missing before Lite IPA trim"; exit 1; }
          rm -f "$IPA_MODEL"
          test -z "$(find "$RUNNER_TEMP/ipa/Payload/Woop.app" -name "$MODEL_NAME" -type f -print -quit)"
          echo "Lite IPA excludes optional Nomic GGUF; full archive retains it."
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/Woop-unsigned.ipa" Payload)
          test -s Woop-unsigned.ipa
          unzip -t Woop-unsigned.ipa
          shasum -a 256 Woop-unsigned.ipa | tee Woop-unsigned.ipa.sha256
          {
            echo "## Woop unsigned IPA"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- IPA: Woop-unsigned.ipa"
            echo "- IPA size: $(stat -f%z Woop-unsigned.ipa) bytes"
            echo "- SHA-256: $(cut -d ' ' -f 1 Woop-unsigned.ipa.sha256)"
            echo "- Signing: unsigned; install using SideStore/AltStore signing."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: woop-unsigned-ipa
          path: |
            Woop-unsigned.ipa
            Woop-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 7
          # IPA is already a ZIP; don't spend runner time trying to compress it a second time.
          compression-level: 0

      - name: Preserve archive log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: woop-ios-build-log
          path: ${{ runner.temp }}/woop-archive.log
          if-no-files-found: ignore
          retention-days: 14

# Build trigger: local-tests generated Info.plist cleanup 9c254fe
# Build trigger: LongTermGoalReaderTests type-check fix 0e40ebc

# Build trigger: SleepLayoutPrefs expected default order fix 0629183

# Build trigger: Apple-only validation gate excludes upstream Android SDK build 7cff542
