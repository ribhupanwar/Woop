name: Woop iOS unsigned IPA

on:
  push:
    branches: [main, feature/whoop-575-ui-parity]
    paths:
      - ".github/workflows/build-woop-ipa.yml"
      - "Strand/**"
      - "StrandTests/**"
      - "StrandiOS/**"
      - "StrandiOSShared/**"
      - "StrandiOSWidgets/**"
      - "StrandiOSTests/**"
      - "Packages/StrandDesign/**"
      - "project.yml"
      - "Tools/local-tests.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: woop-ios-ipa
  cancel-in-progress: false

jobs:
  build-unsigned-ipa:
    name: Build Woop for iPhone and package unsigned IPA
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out UI parity branch
        uses: actions/checkout@v4
        with:
          ref: feature/whoop-575-ui-parity
          fetch-depth: 0

      - name: Select Xcode 26 SDK and install XcodeGen
        run: |
          set -euo pipefail
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          case "$xcode_version" in
            "Xcode 26."*) ;;
            *) echo "::error::This project uses iOS 26 Liquid Glass APIs; Xcode 26 or newer is required."; exit 1 ;;
          esac
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version

      - name: Install pinned on-device model and runtime
        run: |
          chmod +x Tools/bootstrap-nomic.sh
          Tools/bootstrap-nomic.sh

      - name: Run package, macOS, and iOS simulator validation
        run: |
          set -euo pipefail
          echo "Validating latest feature/whoop-575-ui-parity source before IPA packaging."
          echo "Includes RecoveryDetailView iOS-only navigation modifier guard."
          Tools/local-tests.sh origin/main

      - name: Generate Xcode project and verify scheme
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -list -project Strand.xcodeproj
          xcodebuild -list -json -project Strand.xcodeproj > "$RUNNER_TEMP/xcode-list.json"
          python3 - "$RUNNER_TEMP/xcode-list.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as f:
              data = json.load(f)
          schemes = data.get("project", {}).get("schemes", [])
          if "NOOPiOS" not in schemes:
              raise SystemExit(f"NOOPiOS scheme missing; found: {schemes}")
          print("Verified NOOPiOS scheme.")
          PY

      - name: Archive unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Strand.xcodeproj \
            -scheme NOOPiOS \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Woop.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/woop-archive.log"

      - name: Package and verify IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Woop.xcarchive/Products/Applications/NOOP Staging.app"
          test -d "$APP" || { echo "::error::NOOP Staging.app missing from archive"; find "$RUNNER_TEMP/Woop.xcarchive/Products" -maxdepth 4 -print; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/Woop.app"
          # Free Apple ID / SideStore installs append the team suffix to the iPhone
          # bundle identifier. An embedded Watch app keeps its unsuffixed companion
          # identifier and makes iOS reject the install (InvalidCompanionAppBundleIdentifier).
          # This sideload IPA intentionally excludes Watch + extensions; the full archive
          # and source-build targets retain them for paid-team / Xcode distribution.
          rm -rf "$RUNNER_TEMP/ipa/Payload/Woop.app/Watch" "$RUNNER_TEMP/ipa/Payload/Woop.app/PlugIns"
          test ! -e "$RUNNER_TEMP/ipa/Payload/Woop.app/Watch"
          test ! -e "$RUNNER_TEMP/ipa/Payload/Woop.app/PlugIns"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/Woop-unsigned.ipa" Payload)
          test -s Woop-unsigned.ipa
          unzip -t Woop-unsigned.ipa
          shasum -a 256 Woop-unsigned.ipa | tee Woop-unsigned.ipa.sha256
          {
            echo "## Woop unsigned IPA"
            echo "- Branch: feature/whoop-575-ui-parity"
            echo "- IPA: Woop-unsigned.ipa"
            echo "- SHA-256: $(cut -d ' ' -f 1 Woop-unsigned.ipa.sha256)"
            echo "- Signing: unsigned; install using SideStore/AltStore signing."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: woop-unsigned-ipa
          path: |
            Woop-unsigned.ipa
            Woop-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Preserve archive log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: woop-ios-build-log
          path: \${{ runner.temp }}/woop-archive.log
          if-no-files-found: ignore
          retention-days: 14
