name: Woop Android APK

on:
  push:
    branches: [codex/consolidated-release]
    paths:
      - ".github/workflows/build-woop-apk.yml"
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: woop-android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build real-data Android preview and run JVM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android platforms
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build full real-data preview
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 --console=plain -Pnoop.swiftCore=false :app:assembleFullDebug
      - name: Run Android JVM tests
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 --console=plain -Pnoop.swiftCore=false :app:testFullDebugUnitTest
      - name: Package APK and provenance
        if: ${{ !cancelled() && hashFiles('android/app/build/outputs/apk/full/debug/*.apk') != '' }}
        run: |
          mkdir -p apk-artifact
          cp android/app/build/outputs/apk/full/debug/*.apk apk-artifact/Woop-Android-preview.apk
          sha256sum apk-artifact/Woop-Android-preview.apk > apk-artifact/SHA256SUMS.txt
          {
            echo "Source commit: $GITHUB_SHA"
            echo "Variant: fullDebug; real data; demo disabled; Android 8.0+"
            echo "Signing: debug/testing key; package io.github.dx23876.noop.debug"
            echo "Engine: existing Kotlin implementation; optional Swift JNI core not bundled"
            echo "The latest iPhone UI and Swift-only additions are not an Android feature-parity claim."
            echo "Physical phone/Bluetooth/GPS validation remains required."
          } > apk-artifact/BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('apk-artifact/*.apk') != '' }}
        with:
          name: woop-android-preview-apk
          path: apk-artifact/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: woop-android-test-results
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
